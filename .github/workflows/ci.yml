name: Shell script checks

on:
  push:
    paths:
      - "**/*.sh"
  pull_request:
    paths:
      - "**/*.sh"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n syntax check
        run: |
          set -e
          find . -name "*.sh" -print0 | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: |
          set -e
          find . -name "*.sh" -print0 | xargs -0 shellcheck --severity=warning
